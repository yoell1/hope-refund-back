spring:
  application:
    name: hope-refund-back
  config:
    # DB 접속 정보는 프로젝트 루트의 .env 파일에서 읽어요 (.env는 커밋하지 않음 · 이름은 .env.example 참고)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true   # TOTAL_SALARY → totalSalary
    jdbc-type-for-null: 'NULL'           # Oracle에 null을 넘길 때 오류 막기

server:
  port: 8080
  error:
    # 보안: 오류 응답에 스택 트레이스·내부 메시지를 넣지 않아요 (DB 주소·SQL이 밖으로 새는 것 막기)
    include-stacktrace: never
    include-message: never
    include-exception: false

hope:
  calc:
    # mock: 가짜 계산 (파이썬 서버 없이) · http: 파이썬 계산 서버 호출
    mode: ${CALC_MODE:mock}
    url: ${CALC_URL:http://localhost:8000}
    token: ${CALC_API_TOKEN:}
  prediction:
    # 계산 결과를 DB(PREDICTION · PREDICTION_INPUT · PREDICTION_DETAIL)에 저장할지
    # 파이썬 서버 연결 전에는 false (가짜 결과가 공용 DB에 쌓이지 않게) · 연결 후 .env에 SAVE_ENABLED=true
    save-enabled: ${SAVE_ENABLED:false}
